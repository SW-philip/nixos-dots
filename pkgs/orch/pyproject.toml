[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orch = "orch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orch*"]

[tool.setuptools.package-data]
orch = ["schemas/*.json"]
