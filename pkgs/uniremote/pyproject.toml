[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniremote"
version = "0.1.0"
description = "GTK4 Roku/Samsung remote"
requires-python = ">=3.11"
dependencies = [
    "PyGObject",
    "requests",
]

[project.scripts]
uniremote = "uniremote.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
