palette = 5=#d3a527
palette = 6=#dde132
palette = 7=#262626
palette = 8=#4c4c4c
palette = 9=#c1ab1a
palette = 10=#f0c02d
palette = 11=#d7a94b
palette = 12=#9fe72c
palette = 13=#d3a527
palette = 14=#dde132
