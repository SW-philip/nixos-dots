palette = 3=#e8bdf9
palette = 4=#f59ed6
palette = 5=#707ff5
palette = 6=#f2a1f2
palette = 7=#3939a8
palette = 8=#5e5ecf
palette = 9=#4b4bc3
palette = 10=#a195f9
palette = 11=#e8bdf9
palette = 12=#f59ed6
palette = 13=#707ff5
palette = 14=#f2a1f2
palette = 15=#3e3edc

window-padding-x = 12
window-padding-y = 8

# GTK chrome (right-click context menu, command palette) — resolved relative
# to this config's directory, so ghostty.css is copied alongside on activate.
gtk-custom-css = ghostty.css
