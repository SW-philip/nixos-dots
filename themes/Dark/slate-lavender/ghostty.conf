# Ghostty Theme: earl-grey — auto-generated by auto-theme.py
background = #312d39
foreground = #ffffff
cursor-color = #8f86a3
cursor-text = #ffffff
selection-background = #626a76
selection-foreground = #ffffff

# ANSI 0–15 palette
palette = 0=#393b3e
palette = 1=#8f86a3
palette = 2=#b7b2c0
palette = 3=#b3ada7
palette = 4=#d0c7d4
palette = 5=#a59a8c
palette = 6=#ccc9d2
palette = 7=#626262
palette = 8=#888888
palette = 9=#8f86a3
palette = 10=#b7b2c0
palette = 11=#b3ada7
palette = 12=#d0c7d4
palette = 13=#a59a8c
palette = 14=#ccc9d2
palette = 15=#6d7b91

window-padding-x = 12
window-padding-y = 8

# GTK chrome (right-click context menu, command palette) — resolved relative
# to this config's directory, so ghostty.css is copied alongside on activate.
gtk-custom-css = ghostty.css
